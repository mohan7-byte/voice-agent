      # Auto-Commit & Push Scaffolding back to GitHub Repository
      - name: Commit Scaffolding to Repository
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add app/ build.gradle settings.gradle gradle.properties
          git diff-index --quiet HEAD || git commit -m "Auto-scaffold Complete Native Android Project"
          git push origin HEAD:${{ github.ref_name }} || true

      - name: Generate Gradle Wrapper
        run: gradle wrapper --gradle-version 8.5

      - name: Compile Native Debug APK
        run: ./gradlew assembleDebug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Voice-Agent-APK
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Create Native Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete v2.2-Native --yes || true
          git tag -d v2.2-Native || true
          gh release create v2.2-Native app/build/outputs/apk/debug/app-debug.apk \
            --title "Voice Agent v2.2 (Native Pure Android)" \
            --notes "Voice Agent v2.2 Native: App ID com.voice.agent, AppCompat & Material Crash Fixed, Runtime Permissions, OkHttp WebSocket & AudioRecord." || true
