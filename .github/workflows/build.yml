                  "models/gemini-2.0-flash-exp"
              };

              private final String[] voiceOptions = { "Puck", "Aoede", "Charon", "Fenrir", "Kore" };

              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  try {
                      setContentView(R.layout.activity_settings);

                      preferences = getSharedPreferences(PREFS_NAME, MODE_PRIVATE);

                      apiKeyEditText = findViewById(R.id.apiKeyEditText);
                      instructionsEditText = findViewById(R.id.instructionsEditText);
                      playbooksEditor = findViewById(R.id.playbooksEditor);
                      autoDisconnectSwitch = findViewById(R.id.autoDisconnectSwitch);
                      autoConnectSwitch = findViewById(R.id.autoConnectSwitch);
                      speakerEchoGuardSwitch = findViewById(R.id.speakerEchoGuardSwitch);
                      modelSpinner = findViewById(R.id.modelSpinner);
                      voiceSpinner = findViewById(R.id.voiceSpinner);

                      setupApiKeyField();
                      setupSpinners();
                      setupVolumeCard();
                      setupButtons();
                      loadPrefs();
                  } catch (Exception e) {
                      Toast.makeText(this, "Settings init error: " + e.getMessage(), Toast.LENGTH_LONG).show();
                  }
              }

              private void setupApiKeyField() {
                  if (apiKeyEditText != null) {
                      apiKeyEditText.setInputType(InputType.TYPE_CLASS_TEXT | InputType.TYPE_TEXT_VARIATION_PASSWORD);
                      apiKeyEditText.setTransformationMethod(PasswordTransformationMethod.getInstance());
                  }
              }

              private void setupSpinners() {
                  ArrayAdapter<String> mAdapter = new ArrayAdapter<>(this, android.R.layout.simple_spinner_dropdown_item, modelOptions);
                  ArrayAdapter<String> vAdapter = new ArrayAdapter<>(this, android.R.layout.simple_spinner_dropdown_item, voiceOptions);
                  if (modelSpinner != null) modelSpinner.setAdapter(mAdapter);
                  if (voiceSpinner != null) voiceSpinner.setAdapter(vAdapter);
              }

              private void setupVolumeCard() {
                  View card = findViewById(R.id.volumeSetupCard);
                  if (card != null) {
                      card.setOnClickListener(v -> {
                          try {
                              startActivity(new Intent(Settings.ACTION_ACCESSIBILITY_SETTINGS));
                          } catch (Exception e) {
                              startActivity(new Intent(Settings.ACTION_SETTINGS));
                          }
                      });
                  }
              }

              private void setupButtons() {
                  View saveBtn = findViewById(R.id.saveButton);
                  if (saveBtn != null) saveBtn.setOnClickListener(v -> savePrefs());

                  View saveRulesBtn = findViewById(R.id.saveRulesButton);
                  if (saveRulesBtn != null) saveRulesBtn.setOnClickListener(v -> saveRules());

                  View openFilesBtn = findViewById(R.id.openFilesButton);
                  if (openFilesBtn != null) openFilesBtn.setOnClickListener(v -> openInMyFiles());
              }

              private void loadPrefs() {
                  if (apiKeyEditText != null) apiKeyEditText.setText(preferences.getString("api_key", ""));
                  if (instructionsEditText != null) instructionsEditText.setText(preferences.getString("prompt", "You are Voice (Jarvis), an ultra-fast autonomous Android agent with physical device control and experiential memory."));
                  if (playbooksEditor != null) playbooksEditor.setText(preferences.getString("playbooks", "{\n  \"com.samsung.android.app.notes\": {\n    \"actions\": { \"add\": {\"x\": 875, \"y\": 935} }\n  }\n}"));
                  if (autoDisconnectSwitch != null) autoDisconnectSwitch.setChecked(preferences.getBoolean("auto_disconnect", true));
                  if (autoConnectSwitch != null) autoConnectSwitch.setChecked(preferences.getBoolean("auto_connect", false));
                  if (speakerEchoGuardSwitch != null) speakerEchoGuardSwitch.setChecked(preferences.getBoolean("echo_guard", true));
              }

              private void savePrefs() {
                  SharedPreferences.Editor editor = preferences.edit();
                  if (apiKeyEditText != null) editor.putString("api_key", apiKeyEditText.getText().toString().trim());
                  if (instructionsEditText != null) editor.putString("prompt", instructionsEditText.getText().toString());
                  if (playbooksEditor != null) {
                      editor.putString("playbooks", playbooksEditor.getText().toString());
                      saveRulesToFile(playbooksEditor.getText().toString());
                  }
                  if (autoDisconnectSwitch != null) editor.putBoolean("auto_disconnect", autoDisconnectSwitch.isChecked());
                  if (autoConnectSwitch != null) editor.putBoolean("auto_connect", autoConnectSwitch.isChecked());
                  if (speakerEchoGuardSwitch != null) editor.putBoolean("echo_guard", speakerEchoGuardSwitch.isChecked());
                  if (modelSpinner != null && modelSpinner.getSelectedItem() != null) editor.putString("model", modelSpinner.getSelectedItem().toString());
                  if (voiceSpinner != null && voiceSpinner.getSelectedItem() != null) editor.putString("voice", voiceSpinner.getSelectedItem().toString());
                  editor.apply();

                  Toast.makeText(this, "Configuration Saved", Toast.LENGTH_SHORT).show();
                  finish();
              }

              private void saveRules() {
                  if (playbooksEditor != null) {
                      String rules = playbooksEditor.getText().toString();
                      preferences.edit().putString("playbooks", rules).apply();
                      saveRulesToFile(rules);
                      Toast.makeText(this, "Rules Saved & Synced", Toast.LENGTH_SHORT).show();
                  }
              }

              private void saveRulesToFile(String json) {
                  try {
                      File dir = new File(Environment.getExternalStoragePublicDirectory(Environment.DIRECTORY_DOCUMENTS), "Voice");
                      if (!dir.exists()) dir.mkdirs();
                      File file = new File(dir, "rules.json");
                      FileWriter fw = new FileWriter(file, false);
                      fw.write(json);
                      fw.flush();
                      fw.close();
                  } catch (Exception ignored) {}
              }

              private void openInMyFiles() {
                  try {
                      File dir = new File(Environment.getExternalStoragePublicDirectory(Environment.DIRECTORY_DOCUMENTS), "Voice");
                      if (!dir.exists()) dir.mkdirs();
                      File file = new File(dir, "rules.json");
                      if (!file.exists() && playbooksEditor != null) saveRulesToFile(playbooksEditor.getText().toString());

                      StrictMode.VmPolicy.Builder builder = new StrictMode.VmPolicy.Builder();
                      StrictMode.setVmPolicy(builder.build());

                      Intent intent = new Intent(Intent.ACTION_VIEW);
                      intent.setDataAndType(Uri.fromFile(file), "application/json");
                      intent.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK);
                      startActivity(Intent.createChooser(intent, "Open with..."));
                  } catch (Exception e) {
                      Toast.makeText(this, "Error opening file: " + e.getMessage(), Toast.LENGTH_SHORT).show();
                  }
              }
          }
          EOF

          # GeminiLiveManager.java
          cat << 'EOF' > app/src/main/java/com/gemini/live/GeminiLiveManager.java
          package com.gemini.live;

          import android.content.Context;
          import android.media.AudioFormat;
          import android.media.AudioRecord;
          import android.media.AudioTrack;
          import android.media.MediaRecorder;
          import android.os.Handler;
          import android.os.Looper;
          import android.os.SystemClock;
          import android.util.Base64;
          import okhttp3.OkHttpClient;
          import okhttp3.Request;
          import okhttp3.Response;
          import okhttp3.WebSocket;
          import okhttp3.WebSocketListener;
          import org.json.JSONArray;
          import org.json.JSONObject;
          import java.util.concurrent.TimeUnit;

          public class GeminiLiveManager {
              public interface LiveCallback {
                  void onStateChange(String state, String status, String sub);
                  void onTaskStep(int step, String action);
              }

              private Context context;
              private LiveCallback callback;
              private WebSocket webSocket;
              private OkHttpClient client;
              private AudioRecord audioRecord;
              private AudioTrack audioTrack;
              private boolean isRecording = false;
              private boolean isSpeaking = false;
              private Handler mainHandler = new Handler(Looper.getMainLooper());

              public GeminiLiveManager(Context ctx, LiveCallback cb) {
                  this.context = ctx;
                  this.callback = cb;
                  this.client = new OkHttpClient.Builder()
                      .readTimeout(0, TimeUnit.MILLISECONDS)
                      .build();
              }

              public void startSession(String apiKey, String model, String voice, String prompt) {
                  String endpoint = "wss://generativelanguage.googleapis.com/ws/google.ai.generativelanguage.v1beta.GenerativeService.BidiGenerateContent?key=" + apiKey;
                  Request request = new Request.Builder().url(endpoint).build();

                  initAudioTrack();

                  webSocket = client.newWebSocket(request, new WebSocketListener() {
                      @Override
                      public void onOpen(WebSocket ws, Response response) {
                          sendSetupPacket(ws, model, voice, prompt);
                          startMicStream(ws);
                          updateState("listening", "Listening", "Go ahead");
                      }

                      @Override
                      public void onMessage(WebSocket ws, String text) {
                          handleMessage(ws, text);
                      }

                      @Override
                      public void onClosed(WebSocket ws, int code, String reason) {
                          stopSession();
                      }

                      @Override
                      public void onFailure(WebSocket ws, Throwable t, Response response) {
                          stopSession();
                      }
                  });
              }

              private void sendSetupPacket(WebSocket ws, String model, String voice, String prompt) {
                  try {
                      JSONObject setup = new JSONObject();
                      setup.put("model", model.isEmpty() ? "models/gemini-3.1-flash-live-preview" : model);

                      JSONObject generationConfig = new JSONObject();
                      JSONArray modalities = new JSONArray();
                      modalities.put("AUDIO");
                      generationConfig.put("responseModalities", modalities);

                      JSONObject voiceConfig = new JSONObject();
                      JSONObject prebuiltVoice = new JSONObject();
                      prebuiltVoice.put("voiceName", voice.isEmpty() ? "Puck" : voice);
                      voiceConfig.put("prebuiltVoiceConfig", prebuiltVoice);
                      JSONObject speechConfig = new JSONObject();
                      speechConfig.put("voiceConfig", voiceConfig);
                      generationConfig.put("speechConfig", speechConfig);
                      setup.put("generationConfig", generationConfig);

                      if (!prompt.isEmpty()) {
                          JSONObject sysInst = new JSONObject();
                          JSONArray parts = new JSONArray();
                          JSONObject part = new JSONObject();
                          part.put("text", prompt);
                          parts.put(part);
                          sysInst.put("parts", parts);
                          setup.put("systemInstruction", sysInst);
                      }

                      JSONObject root = new JSONObject();
                      root.put("setup", setup);
                      ws.send(root.toString());
                  } catch (Exception ignored) {}
              }

              private void startMicStream(WebSocket ws) {
                  int sampleRate = 16000;
                  int bufferSize = AudioRecord.getMinBufferSize(sampleRate, AudioFormat.CHANNEL_IN_MONO, AudioFormat.ENCODING_PCM_16BIT);
                  try {
                      audioRecord = new AudioRecord(MediaRecorder.AudioSource.VOICE_RECOGNITION, sampleRate, AudioFormat.CHANNEL_IN_MONO, AudioFormat.ENCODING_PCM_16BIT, bufferSize * 2);
                      audioRecord.startRecording();
                      isRecording = true;

                      new Thread(() -> {
                          byte[] buffer = new byte[1024];
                          while (isRecording) {
                              if (isSpeaking) {
                                  SystemClock.sleep(20);
                                  continue;
                              }
                              int read = audioRecord.read(buffer, 0, buffer.length);
                              if (read > 0 && ws != null) {
                                  String b64 = Base64.encodeToString(buffer, 0, read, Base64.NO_WRAP);
                                  try {
                                      JSONObject frame = new JSONObject();
                                      JSONObject realtime = new JSONObject();
                                      JSONObject media = new JSONObject();
                                      media.put("mimeType", "audio/pcm;rate=16000");
                                      media.put("data", b64);
                                      realtime.put("audio", media);
                                      frame.put("realtimeInput", realtime);
                                      ws.send(frame.toString());
                                  } catch (Exception ignored) {}
                              }
                          }
                      }).start();
                  } catch (Exception ignored) {}
              }

              private void initAudioTrack() {
                  int sampleRate = 24000;
                  int bufferSize = AudioTrack.getMinBufferSize(sampleRate, AudioFormat.CHANNEL_OUT_MONO, AudioFormat.ENCODING_PCM_16BIT);
                  audioTrack = new AudioTrack(android.media.AudioManager.STREAM_MUSIC, sampleRate, AudioFormat.CHANNEL_OUT_MONO, AudioFormat.ENCODING_PCM_16BIT, bufferSize * 2, AudioTrack.MODE_STREAM);
                  audioTrack.play();
              }

              private void handleMessage(WebSocket ws, String jsonText) {
                  try {
                      JSONObject msg = new JSONObject(jsonText);

                      if (msg.has("toolCall")) {
                          JSONObject toolCall = msg.getJSONObject("toolCall");
                          JSONArray calls = toolCall.getJSONArray("functionCalls");
                          for (int i = 0; i < calls.length(); i++) {
                              JSONObject call = calls.getJSONObject(i);
                              executeTool(ws, call.getString("name"), call.optJSONObject("args"), call.optString("id", "1"));
                          }
                      }

                      if (msg.has("serverContent")) {
                          JSONObject sc = msg.getJSONObject("serverContent");
                          if (sc.optBoolean("interrupted", false)) {
                              if (audioTrack != null) audioTrack.flush();
                              isSpeaking = false;
                              updateState("listening", "Listening", "Go ahead");
                              return;
                          }
                          if (sc.has("modelTurn")) {
                              JSONArray parts = sc.getJSONObject("modelTurn").getJSONArray("parts");
                              for (int i = 0; i < parts.length(); i++) {
                                  JSONObject part = parts.getJSONObject(i);
                                  if (part.has("inlineData")) {
                                      isSpeaking = true;
                                      updateState("speaking", "Speaking", "Jarvis...");
                                      byte[] pcm = Base64.decode(part.getJSONObject("inlineData").getString("data"), Base64.DEFAULT);
                                      if (audioTrack != null) audioTrack.write(pcm, 0, pcm.length);
                                  }
                              }
                          }
                          if (sc.optBoolean("turnComplete", false)) {
                              mainHandler.postDelayed(() -> {
                                  isSpeaking = false;
                                  updateState("listening", "Listening", "Go ahead");
                              }, 350);
                          }
                      }
                  } catch (Exception ignored) {}
              }

              private void executeTool(WebSocket ws, String name, JSONObject args, String callId) {
                  updateState("working", "Working...", name);
                  String result = "Completed";

                  try {
                      if (VolumeTriggerService.instance != null) {
                          if (name.equals("tap_coordinates")) {
                              int x = args.getInt("x");
                              int y = args.getInt("y");
                              boolean ok = VolumeTriggerService.instance.tapCoordinates(x, y);
                              result = ok ? "Tapped coordinates" : "Failed to tap";
                          } else if (name.equals("long_press")) {
                              int x = args.getInt("x");
                              int y = args.getInt("y");
                              boolean ok = VolumeTriggerService.instance.longPress(x, y);
                              result = ok ? "Long-pressed" : "Failed";
                          } else if (name.equals("type_text")) {
                              boolean ok = VolumeTriggerService.instance.typeText(args.getString("text"));
                              result = ok ? "Typed text" : "Could not find focused input";
                          } else if (name.equals("scroll")) {
                              boolean ok = VolumeTriggerService.instance.scroll(args.optString("direction", "down"));
                              result = ok ? "Scrolled" : "Failed";
                          } else if (name.equals("read_screen_text")) {
                              result = VolumeTriggerService.instance.readScreenText();
                          }
                      }
                  } catch (Exception e) {
                      result = "Error: " + e.getMessage();
                  }

                  try {
                      JSONObject toolResp = new JSONObject();
                      JSONObject tr = new JSONObject();
                      JSONArray fr = new JSONArray();
                      JSONObject resp = new JSONObject();
                      resp.put("id", callId);
                      JSONObject out = new JSONObject();
                      out.put("result", result);
                      resp.put("response", new JSONObject().put("output", out));
                      fr.put(resp);
                      tr.put("functionResponses", fr);
                      toolResp.put("toolResponse", tr);
                      ws.send(toolResp.toString());
                  } catch (Exception ignored) {}
              }

              private void updateState(String state, String status, String sub) {
                  mainHandler.post(() -> {
                      if (callback != null) callback.onStateChange(state, status, sub);
                  });
              }

              public void stopSession() {
                  isRecording = false;
                  isSpeaking = false;
                  if (audioRecord != null) {
                      try { audioRecord.stop(); audioRecord.release(); } catch (Exception ignored) {}
                      audioRecord = null;
                  }
                  if (audioTrack != null) {
                      try { audioTrack.stop(); audioTrack.release(); } catch (Exception ignored) {}
                      audioTrack = null;
                  }
                  if (webSocket != null) {
                      webSocket.close(1000, "User ended");
                      webSocket = null;
                  }
                  updateState("idle", "Voice", "Ready");
              }
          }
          EOF

          # MainActivity.java (AppCompatActivity + Material Crash Fixed + Runtime Permissions)
          cat << 'EOF' > app/src/main/java/com/gemini/live/MainActivity.java
          package com.gemini.live;

          import android.Manifest;
          import android.content.Intent;
          import android.content.SharedPreferences;
          import android.content.pm.PackageManager;
          import android.graphics.Color;
          import android.graphics.drawable.ColorDrawable;
          import android.os.Build;
          import android.os.Bundle;
          import android.view.KeyEvent;
          import android.view.View;
          import android.widget.LinearLayout;
          import android.widget.TextView;
          import androidx.appcompat.app.AppCompatActivity;
          import com.google.android.material.button.MaterialButton;

          public class MainActivity extends AppCompatActivity implements GeminiLiveManager.LiveCallback {
              private GeminiLiveManager liveManager;
              private TextView statusText, subText;
              private MaterialButton btnConnect;
              private LinearLayout activeControlsGroup;
              private View orbGlow, orbCore;
              private SharedPreferences prefs;

              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);

                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O_MR1) {
                      setShowWhenLocked(true);
                      setTurnScreenOn(true);
                  }

                  getWindow().setBackgroundDrawable(new ColorDrawable(Color.TRANSPARENT));
                  setContentView(R.layout.activity_main);

                  // Request Runtime Permissions
                  String[] perms = {
                      Manifest.permission.RECORD_AUDIO,
                      Manifest.permission.CAMERA,
                      Manifest.permission.CALL_PHONE,
                      Manifest.permission.SEND_SMS,
                      Manifest.permission.READ_CONTACTS
                  };
                  for (String p : perms) {
                      if (checkSelfPermission(p) != PackageManager.PERMISSION_GRANTED) {
                          requestPermissions(perms, 101);
                          break;
                      }
                  }

                  prefs = getSharedPreferences("voice_prefs", MODE_PRIVATE);
                  liveManager = new GeminiLiveManager(this, this);

                  statusText = findViewById(R.id.statusText);
                  subText = findViewById(R.id.subText);
                  btnConnect = findViewById(R.id.btnConnect);
                  activeControlsGroup = findViewById(R.id.activeControlsGroup);
                  orbGlow = findViewById(R.id.orbGlow);
                  orbCore = findViewById(R.id.orbCore);

                  btnConnect.setOnClickListener(v -> startVoiceSession());
                  findViewById(R.id.btnEnd).setOnClickListener(v -> liveManager.stopSession());
                  findViewById(R.id.btnSettings).setOnClickListener(v -> {
                      startActivity(new Intent(this, SettingsActivity.class));
                  });

                  findViewById(R.id.rootTouchContainer).setOnClickListener(v -> moveTaskToBack(true));
              }

              private void startVoiceSession() {
                  String apiKey = prefs.getString("api_key", "");
                  if (apiKey.isEmpty()) {
                      startActivity(new Intent(this, SettingsActivity.class));
                      return;
                  }
                  String model = prefs.getString("model", "models/gemini-3.1-flash-live-preview");
                  String voice = prefs.getString("voice", "Puck");
                  String prompt = prefs.getString("prompt", "");

                  liveManager.startSession(apiKey, model, voice, prompt);
              }

              @Override
              public void onStateChange(String state, String status, String sub) {
                  statusText.setText(status);
                  subText.setText(sub);

                  if (state.equals("idle")) {
                      btnConnect.setVisibility(View.VISIBLE);
                      activeControlsGroup.setVisibility(View.GONE);
                      orbGlow.setBackgroundColor(Color.parseColor("#4338CA"));
                  } else {
                      btnConnect.setVisibility(View.GONE);
                      activeControlsGroup.setVisibility(View.VISIBLE);

                      if (state.equals("listening")) {
                          orbGlow.setBackgroundColor(Color.parseColor("#A855F7"));
                      } else if (state.equals("working")) {
                          orbGlow.setBackgroundColor(Color.parseColor("#06B6D4"));
                      } else if (state.equals("speaking")) {
                          orbGlow.setBackgroundColor(Color.parseColor("#FBBF24"));
                      }
                  }
              }

              @Override
              public void onTaskStep(int step, String action) {
                  subText.setText("Step " + step + ": " + action);
              }

              @Override
              public boolean onKeyDown(int keyCode, KeyEvent event) {
                  if (keyCode == KeyEvent.KEYCODE_BACK) {
                      moveTaskToBack(true);
                      return true;
                  }
                  return super.onKeyDown(keyCode, event);
              }

              @Override
              protected void onDestroy() {
                  if (liveManager != null) liveManager.stopSession();
                  super.onDestroy();
              }
          }
