name: Build Voice Native APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Accept Android SDK Licenses
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Scaffold Complete Native Project
        run: |
          mkdir -p app/src/main/java/com/gemini/live
          mkdir -p app/src/main/res/layout
          mkdir -p app/src/main/res/values
          mkdir -p app/src/main/res/drawable
          mkdir -p app/src/main/res/xml
          mkdir -p app/src/main/res/mipmap-hdpi
          mkdir -p app/src/main/res/mipmap-mdpi
          mkdir -p app/src/main/res/mipmap-xhdpi
          mkdir -p app/src/main/res/mipmap-xxhdpi
          mkdir -p app/src/main/res/mipmap-xxxhdpi

          # Launcher Icon
          echo "iVBORw0KGgoAAAANSUhEUgAAAEAAAABACAYAAACqaXHeAAAATUlEQVR42u3PMQEAAAgEIPuX1hgc/LDBV9JJ6rWTAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAwBv0hQABH1mYugAAAABJRU5ErkJggg==" | base64 -d > app/src/main/res/mipmap-hdpi/ic_launcher.png
          cp app/src/main/res/mipmap-hdpi/ic_launcher.png app/src/main/res/mipmap-mdpi/ic_launcher.png
          cp app/src/main/res/mipmap-hdpi/ic_launcher.png app/src/main/res/mipmap-xhdpi/ic_launcher.png
          cp app/src/main/res/mipmap-hdpi/ic_launcher.png app/src/main/res/mipmap-xxhdpi/ic_launcher.png
          cp app/src/main/res/mipmap-hdpi/ic_launcher.png app/src/main/res/mipmap-xxxhdpi/ic_launcher.png

          cat << 'EOF' > gradle.properties
          android.useAndroidX=true
          android.nonTransitiveRClass=true
          org.gradle.jvmargs=-Xmx2048m
          EOF

          cat << 'EOF' > settings.gradle
          rootProject.name = "VoiceAgent"
          include ':app'
          EOF

          cat << 'EOF' > build.gradle
          buildscript {
              repositories {
                  google()
                  mavenCentral()
              }
              dependencies {
                  classpath 'com.android.tools.build:gradle:8.2.2'
              }
          }
          allprojects {
              repositories {
                  google()
                  mavenCentral()
              }
          }
          EOF

          # New App ID: com.voice.agent (Completely Separate App)
          cat << 'EOF' > app/build.gradle
          apply plugin: 'com.android.application'

          android {
              namespace 'com.gemini.live'
              compileSdk 34

              defaultConfig {
                  applicationId "com.voice.agent"
                  minSdk 24
                  targetSdk 34
                  versionCode 16
                  versionName "2.2-Native"
              }
              buildTypes {
                  release {
                      minifyEnabled false
                  }
              }
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
          }

          dependencies {
              implementation 'androidx.appcompat:appcompat:1.6.1'
              implementation 'com.google.android.material:material:1.11.0'
              implementation 'androidx.core:core:1.12.0'
              implementation 'com.squareup.okhttp3:okhttp:4.12.0'
          }
          EOF

          cat << 'EOF' > app/src/main/res/values/strings.xml
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <string name="app_name">Voice Agent</string>
              <string name="accessibility_desc">Enables autonomous device controls, sniper coordinates, and experiential memory.</string>
          </resources>
          EOF

          cat << 'EOF' > app/src/main/res/xml/accessibility_service_config.xml
          <?xml version="1.0" encoding="utf-8"?>
          <accessibility-service xmlns:android="http://schemas.android.com/apk/res/android"
              android:accessibilityEventTypes="typeWindowStateChanged|typeWindowContentChanged"
              android:accessibilityFeedbackType="feedbackGeneric"
              android:accessibilityFlags="flagDefault|flagRequestFilterKeyEvents|flagRetrieveInteractiveWindows"
              android:canRequestFilterKeyEvents="true"
              android:canRetrieveWindowContent="true"
              android:canPerformGestures="true"
              android:description="@string/accessibility_desc"
              android:notificationTimeout="50" />
          EOF

          cat << 'EOF' > app/src/main/res/values/colors.xml
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <color name="oled_background">#0D101A</color>
              <color name="oled_surface">#121420</color>
              <color name="oled_surface_alt">#171A27</color>
              <color name="purple_accent">#7C3AED</color>
              <color name="purple_accent_dark">#5B21B6</color>
              <color name="purple_accent_soft">#241642</color>
              <color name="cyan_accent">#06B6D4</color>
              <color name="amber_accent">#FBBF24</color>
              <color name="danger_red">#EF4444</color>
              <color name="white_primary">#F8F8FC</color>
              <color name="white_secondary">#A7A9B7</color>
              <color name="white_tertiary">#777B8D</color>
              <color name="border_white_15">#26FFFFFF</color>
              <color name="border_white_10">#1AFFFFFF</color>
              <color name="input_black">#000000</color>
              <color name="switch_off_track">#303444</color>
              <color name="switch_off_thumb">#D7D9E2</color>
              <color name="dropdown_background">#171A27</color>
              <color name="dropdown_selected">#241642</color>
          </resources>
          EOF

          # MaterialComponents Themes (Crash Fixed)
          cat << 'EOF' > app/src/main/res/values/styles.xml
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <style name="AppTheme" parent="Theme.MaterialComponents.DayNight.NoActionBar">
                  <item name="android:statusBarColor">@color/oled_background</item>
                  <item name="android:navigationBarColor">@color/oled_background</item>
                  <item name="android:windowBackground">@color/oled_background</item>
                  <item name="colorPrimary">@color/purple_accent</item>
                  <item name="colorSecondary">@color/purple_accent</item>
              </style>

              <style name="TranslucentFloatingTheme" parent="Theme.MaterialComponents.DayNight.NoActionBar">
                  <item name="android:windowBackground">@android:color/transparent</item>
                  <item name="android:colorBackgroundCacheHint">@null</item>
                  <item name="android:windowIsTranslucent">true</item>
                  <item name="android:windowAnimationStyle">@android:style/Animation</item>
                  <item name="android:windowNoTitle">true</item>
                  <item name="android:windowContentOverlay">@null</item>
                  <item name="colorPrimary">@color/purple_accent</item>
                  <item name="colorSecondary">@color/purple_accent</item>
              </style>

              <style name="SettingsSectionLabel" parent="TextAppearance.MaterialComponents.Caption">
                  <item name="android:textSize">10sp</item>
                  <item name="android:letterSpacing">0.08</item>
                  <item name="android:textColor">@color/white_secondary</item>
                  <item name="android:textStyle">bold</item>
              </style>

              <style name="SettingsRowTitle" parent="TextAppearance.MaterialComponents.Body1">
                  <item name="android:textSize">13sp</item>
                  <item name="android:textColor">@color/white_primary</item>
              </style>

              <style name="SettingsRowSubtitle" parent="TextAppearance.MaterialComponents.Caption">
                  <item name="android:textSize">9sp</item>
                  <item name="android:textColor">@color/white_tertiary</item>
              </style>

              <style name="SettingsInputText" parent="TextAppearance.MaterialComponents.Body1">
                  <item name="android:textSize">12sp</item>
                  <item name="android:textColor">@color/white_primary</item>
                  <item name="android:textColorHint">@color/white_secondary</item>
              </style>
          </resources>
          EOF

          # Drawables
          cat << 'EOF' > app/src/main/res/drawable/bg_purple_card.xml
          <?xml version="1.0" encoding="utf-8"?>
          <shape xmlns:android="http://schemas.android.com/apk/res/android" android:shape="rectangle">
              <solid android:color="#241642" />
              <stroke android:width="1dp" android:color="#387C3AED" />
              <corners android:radius="14dp" />
              <padding android:left="14dp" android:top="11dp" android:right="12dp" android:bottom="11dp" />
          </shape>
          EOF

          cat << 'EOF' > app/src/main/res/drawable/bg_input_field.xml
          <?xml version="1.0" encoding="utf-8"?>
          <shape xmlns:android="http://schemas.android.com/apk/res/android" android:shape="rectangle">
              <solid android:color="#000000" />
              <stroke android:width="1dp" android:color="#26FFFFFF" />
              <corners android:radius="11dp" />
              <padding android:left="12dp" android:top="10dp" android:right="12dp" android:bottom="10dp" />
          </shape>
          EOF

          cat << 'EOF' > app/src/main/res/drawable/bg_capsule.xml
          <?xml version="1.0" encoding="utf-8"?>
          <shape xmlns:android="http://schemas.android.com/apk/res/android" android:shape="rectangle">
              <solid android:color="#F20D101A" />
              <stroke android:width="1dp" android:color="#33FFFFFF" />
              <corners android:radius="999dp" />
          </shape>
          EOF

          cat << 'EOF' > app/src/main/res/drawable/bg_icon_btn.xml
          <?xml version="1.0" encoding="utf-8"?>
          <shape xmlns:android="http://schemas.android.com/apk/res/android" android:shape="oval">
              <solid android:color="#1AFFFFFF" />
              <stroke android:width="1dp" android:color="#26FFFFFF" />
          </shape>
          EOF

          # Layouts: Native Floating Capsule (activity_main.xml)
          cat << 'EOF' > app/src/main/res/layout/activity_main.xml
          <?xml version="1.0" encoding="utf-8"?>
          <RelativeLayout xmlns:android="http://schemas.android.com/apk/res/android"
              xmlns:app="http://schemas.android.com/apk/res-auto"
              android:id="@+id/rootTouchContainer"
              android:layout_width="match_parent"
              android:layout_height="match_parent"
              android:background="@android:color/transparent">

              <!-- 56px Native Floating Capsule -->
              <LinearLayout
                  android:id="@+id/floatingCapsule"
                  android:layout_width="wrap_content"
                  android:layout_height="52dp"
                  android:layout_alignParentBottom="true"
                  android:layout_centerHorizontal="true"
                  android:layout_marginBottom="24dp"
                  android:background="@drawable/bg_capsule"
                  android:elevation="12dp"
                  android:gravity="center_vertical"
                  android:orientation="horizontal"
                  android:paddingStart="8dp"
                  android:paddingEnd="12dp">

                  <!-- Orb View -->
                  <FrameLayout
                      android:layout_width="38dp"
                      android:layout_height="38dp">
                      <View
                          android:id="@+id/orbGlow"
                          android:layout_width="36dp"
                          android:layout_height="36dp"
                          android:layout_gravity="center"
                          android:background="@drawable/bg_icon_btn" />
                      <View
                          android:id="@+id/orbCore"
                          android:layout_width="22dp"
                          android:layout_height="22dp"
                          android:layout_gravity="center"
                          android:background="@drawable/bg_icon_btn" />
                  </FrameLayout>

                  <!-- Status Text -->
                  <LinearLayout
                      android:layout_width="wrap_content"
                      android:layout_height="wrap_content"
                      android:layout_marginStart="8dp"
                      android:layout_marginEnd="12dp"
                      android:orientation="vertical">
                      <TextView
                          android:id="@+id/statusText"
                          android:layout_width="wrap_content"
                          android:layout_height="wrap_content"
                          android:text="Voice"
                          android:textColor="@color/white_primary"
                          android:textSize="13sp"
                          android:textStyle="bold" />
                      <TextView
                          android:id="@+id/subText"
                          android:layout_width="wrap_content"
                          android:layout_height="wrap_content"
                          android:text="Ready"
                          android:textColor="@color/white_secondary"
                          android:textSize="10sp" />
                  </LinearLayout>

                  <!-- Start / Action Controls -->
                  <com.google.android.material.button.MaterialButton
                      android:id="@+id/btnConnect"
                      android:layout_width="wrap_content"
                      android:layout_height="36dp"
                      android:text="Start"
                      android:textAllCaps="false"
                      android:textColor="@color/white_primary"
                      android:textSize="12sp"
                      app:backgroundTint="@color/purple_accent"
                      app:cornerRadius="999dp" />

                  <LinearLayout
                      android:id="@+id/activeControlsGroup"
                      android:layout_width="wrap_content"
                      android:layout_height="wrap_content"
                      android:orientation="horizontal"
                      android:visibility="gone">

                      <ImageButton
                          android:id="@+id/btnMute"
                          android:layout_width="36dp"
                          android:layout_height="36dp"
                          android:layout_marginEnd="6dp"
                          android:background="@drawable/bg_icon_btn"
                          android:src="@android:drawable/ic_btn_speak_now" />

                      <ImageButton
                          android:id="@+id/btnEnd"
                          android:layout_width="36dp"
                          android:layout_height="36dp"
                          android:background="@drawable/bg_icon_btn"
                          android:src="@android:drawable/ic_menu_close_clear_cancel" />
                  </LinearLayout>

                  <ImageButton
                      android:id="@+id/btnSettings"
                      android:layout_width="36dp"
                      android:layout_height="36dp"
                      android:layout_marginStart="8dp"
                      android:background="@drawable/bg_icon_btn"
                      android:src="@android:drawable/ic_menu_manage" />

              </LinearLayout>

          </RelativeLayout>
          EOF

          # Layouts: Settings Screen (activity_settings.xml)
          cat << 'EOF' > app/src/main/res/layout/activity_settings.xml
          <?xml version="1.0" encoding="utf-8"?>
          <androidx.core.widget.NestedScrollView
              xmlns:android="http://schemas.android.com/apk/res/android"
              xmlns:app="http://schemas.android.com/apk/res-auto"
              android:layout_width="match_parent"
              android:layout_height="match_parent"
              android:fillViewport="true"
              android:background="@color/oled_background"
              android:paddingTop="8dp"
              android:paddingBottom="24dp">

              <LinearLayout
                  android:layout_width="match_parent"
                  android:layout_height="wrap_content"
                  android:orientation="vertical"
                  android:paddingStart="16dp"
                  android:paddingEnd="16dp">

                  <!-- Double-click volume setup -->
                  <com.google.android.material.card.MaterialCardView
                      android:id="@+id/volumeSetupCard"
                      android:layout_width="match_parent"
                      android:layout_height="wrap_content"
                      android:layout_marginTop="4dp"
                      android:layout_marginBottom="16dp"
                      android:clickable="true"
                      android:focusable="true"
                      app:cardBackgroundColor="@android:color/transparent"
                      app:cardCornerRadius="14dp"
                      app:cardElevation="0dp"
                      app:strokeWidth="0dp">

                      <LinearLayout
                          android:layout_width="match_parent"
                          android:layout_height="wrap_content"
                          android:background="@drawable/bg_purple_card"
                          android:gravity="center_vertical"
                          android:minHeight="64dp"
                          android:orientation="horizontal">

                          <TextView
                              android:layout_width="30dp"
                              android:layout_height="30dp"
                              android:gravity="center"
                              android:text="⚡"
                              android:textColor="@color/white_primary"
                              android:textSize="18sp" />

                          <LinearLayout
                              android:layout_width="0dp"
                              android:layout_height="wrap_content"
                              android:layout_weight="1"
                              android:orientation="vertical"
                              android:paddingStart="6dp"
                              android:paddingEnd="8dp">

                              <TextView
                                  android:layout_width="match_parent"
                                  android:layout_height="wrap_content"
                                  android:text="Double-Click Volume Setup"
                                  android:textColor="@color/white_primary"
                                  android:textSize="13sp"
                                  android:textStyle="bold" />

                              <TextView
                                  android:layout_width="match_parent"
                                  android:layout_height="wrap_content"
                                  android:layout_marginTop="2dp"
                                  android:text="Tap to open Accessibility &amp; turn on Voice trigger"
                                  android:textColor="@color/white_secondary"
                                  android:textSize="9sp" />
                          </LinearLayout>

                          <TextView
                              android:layout_width="24dp"
                              android:layout_height="wrap_content"
                              android:gravity="center"
                              android:text="›"
                              android:textColor="@color/white_primary"
                              android:textSize="22sp" />
                      </LinearLayout>
                  </com.google.android.material.card.MaterialCardView>

                  <!-- Playbooks & Memory Section -->
                  <TextView
                      style="@style/SettingsSectionLabel"
                      android:layout_width="match_parent"
                      android:layout_height="wrap_content"
                      android:text="PLAYBOOKS &amp; EXPERIENTIAL MEMORY"
                      android:layout_marginBottom="6dp" />

                  <com.google.android.material.card.MaterialCardView
                      android:layout_width="match_parent"
                      android:layout_height="wrap_content"
                      android:layout_marginBottom="16dp"
                      app:cardBackgroundColor="@color/oled_surface"
                      app:cardCornerRadius="13dp"
                      app:cardElevation="0dp"
                      app:strokeColor="@color/border_white_10"
                      app:strokeWidth="1dp">

                      <LinearLayout
                          android:layout_width="match_parent"
                          android:layout_height="wrap_content"
                          android:orientation="vertical"
                          android:padding="12dp">

                          <TextView
                              android:layout_width="match_parent"
                              android:layout_height="wrap_content"
                              android:text="Exact coordinates &amp; self-learned app rules"
                              android:textColor="@color/white_secondary"
                              android:textSize="9sp"
                              android:layout_marginBottom="8dp" />

                          <EditText
                              android:id="@+id/playbooksEditor"
                              android:layout_width="match_parent"
                              android:layout_height="110dp"
                              android:background="@drawable/bg_input_field"
                              android:gravity="top|start"
                              android:inputType="textMultiLine"
                              android:padding="10dp"
                              android:scrollbars="vertical"
                              android:textColor="@color/white_primary"
                              android:textColorHint="@color/white_tertiary"
                              android:textSize="10sp"
                              android:fontFamily="monospace" />

                          <LinearLayout
                              android:layout_width="match_parent"
                              android:layout_height="wrap_content"
                              android:layout_marginTop="9dp"
                              android:orientation="horizontal">

                              <com.google.android.material.button.MaterialButton
                                  android:id="@+id/saveRulesButton"
                                  android:layout_width="wrap_content"
                                  android:layout_height="38dp"
                                  android:text="Save Rules"
                                  android:textAllCaps="false"
                                  android:textColor="@color/white_primary"
                                  android:textSize="11sp"
                                  app:backgroundTint="@color/purple_accent"
                                  app:cornerRadius="9dp" />

                              <Space
                                  android:layout_width="8dp"
                                  android:layout_height="1dp" />

                              <com.google.android.material.button.MaterialButton
                                  android:id="@+id/openFilesButton"
                                  android:layout_width="wrap_content"
                                  android:layout_height="38dp"
                                  android:text="Open in My Files"
                                  android:textAllCaps="false"
                                  android:textColor="@color/white_primary"
                                  android:textSize="11sp"
                                  app:backgroundTint="@color/oled_surface_alt"
                                  app:cornerRadius="9dp"
                                  app:strokeColor="@color/border_white_15"
                                  app:strokeWidth="1dp" />
                          </LinearLayout>
                      </LinearLayout>
                  </com.google.android.material.card.MaterialCardView>

                  <!-- Gemini API Key -->
                  <TextView
                      style="@style/SettingsSectionLabel"
                      android:layout_width="match_parent"
                      android:layout_height="wrap_content"
                      android:text="GEMINI API KEY"
                      android:layout_marginBottom="6dp" />

                  <EditText
                      android:id="@+id/apiKeyEditText"
                      style="@style/SettingsInputText"
                      android:layout_width="match_parent"
                      android:layout_height="44dp"
                      android:layout_marginBottom="14dp"
                      android:background="@drawable/bg_input_field"
                      android:hint="AIzaSy..."
                      android:inputType="textPassword"
                      android:singleLine="true"
                      android:imeOptions="actionDone" />

                  <!-- Switches: Using 100% Reliable SwitchCompat -->
                  <LinearLayout
                      android:layout_width="match_parent"
                      android:layout_height="54dp"
                      android:gravity="center_vertical"
                      android:orientation="horizontal">
                      <LinearLayout
                          android:layout_width="0dp"
                          android:layout_height="wrap_content"
                          android:layout_weight="1"
                          android:orientation="vertical">
                          <TextView
                              style="@style/SettingsRowTitle"
                              android:layout_width="match_parent"
                              android:layout_height="wrap_content"
                              android:text="Auto-Disconnect on Silence (4s)" />
                          <TextView
                              style="@style/SettingsRowSubtitle"
                              android:layout_width="match_parent"
                              android:layout_height="wrap_content"
                              android:text="Close call after finishing task" />
                      </LinearLayout>
                      <androidx.appcompat.widget.SwitchCompat
                          android:id="@+id/autoDisconnectSwitch"
                          android:layout_width="wrap_content"
                          android:layout_height="wrap_content" />
                  </LinearLayout>

                  <LinearLayout
                      android:layout_width="match_parent"
                      android:layout_height="54dp"
                      android:gravity="center_vertical"
                      android:orientation="horizontal">
                      <LinearLayout
                          android:layout_width="0dp"
                          android:layout_height="wrap_content"
                          android:layout_weight="1"
                          android:orientation="vertical">
                          <TextView
                              style="@style/SettingsRowTitle"
                              android:layout_width="match_parent"
                              android:layout_height="wrap_content"
                              android:text="Auto-Connect on Launch" />
                          <TextView
                              style="@style/SettingsRowSubtitle"
                              android:layout_width="match_parent"
                              android:layout_height="wrap_content"
                              android:text="Listen immediately when triggered" />
                      </LinearLayout>
                      <androidx.appcompat.widget.SwitchCompat
                          android:id="@+id/autoConnectSwitch"
                          android:layout_width="wrap_content"
                          android:layout_height="wrap_content" />
                  </LinearLayout>

                  <LinearLayout
                      android:layout_width="match_parent"
                      android:layout_height="54dp"
                      android:gravity="center_vertical"
                      android:orientation="horizontal">
                      <LinearLayout
                          android:layout_width="0dp"
                          android:layout_height="wrap_content"
                          android:layout_weight="1"
                          android:orientation="vertical">
                          <TextView
                              style="@style/SettingsRowTitle"
                              android:layout_width="match_parent"
                              android:layout_height="wrap_content"
                              android:text="Speaker Echo Guard" />
                          <TextView
                              style="@style/SettingsRowSubtitle"
                              android:layout_width="match_parent"
                              android:layout_height="wrap_content"
                              android:text="Prevents speaker feedback loop" />
                      </LinearLayout>
                      <androidx.appcompat.widget.SwitchCompat
                          android:id="@+id/speakerEchoGuardSwitch"
                          android:layout_width="wrap_content"
                          android:layout_height="wrap_content"
                          android:checked="true" />
                  </LinearLayout>

                  <!-- Instructions -->
                  <TextView
                      style="@style/SettingsSectionLabel"
                      android:layout_width="match_parent"
                      android:layout_height="wrap_content"
                      android:layout_marginTop="12dp"
                      android:text="ASSISTANT INSTRUCTIONS (JARVIS PROTOCOL)"
                      android:layout_marginBottom="6dp" />

                  <EditText
                      android:id="@+id/instructionsEditText"
                      style="@style/SettingsInputText"
                      android:layout_width="match_parent"
                      android:layout_height="80dp"
                      android:layout_marginBottom="14dp"
                      android:background="@drawable/bg_input_field"
                      android:gravity="top|start"
                      android:inputType="textMultiLine"
                      android:text="You are Voice (Jarvis), an ultra-fast autonomous Android agent with physical device control and experiential memory." />

                  <!-- Model Spinner -->
                  <TextView
                      style="@style/SettingsSectionLabel"
                      android:layout_width="match_parent"
                      android:layout_height="wrap_content"
                      android:text="TARGET MODEL"
                      android:layout_marginBottom="6dp" />

                  <Spinner
                      android:id="@+id/modelSpinner"
                      android:layout_width="match_parent"
                      android:layout_height="44dp"
                      android:layout_marginBottom="14dp"
                      android:background="@drawable/bg_input_field"
                      android:spinnerMode="dropdown" />

                  <!-- Voice Profile Spinner -->
                  <TextView
                      style="@style/SettingsSectionLabel"
                      android:layout_width="match_parent"
                      android:layout_height="wrap_content"
                      android:text="VOICE PROFILE"
                      android:layout_marginBottom="6dp" />

                  <Spinner
                      android:id="@+id/voiceSpinner"
                      android:layout_width="match_parent"
                      android:layout_height="44dp"
                      android:layout_marginBottom="18dp"
                      android:background="@drawable/bg_input_field"
                      android:spinnerMode="dropdown" />

                  <com.google.android.material.button.MaterialButton
                      android:id="@+id/saveButton"
                      android:layout_width="match_parent"
                      android:layout_height="48dp"
                      android:text="Save Configuration"
